<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up Form Project</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Saira+Stencil:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <script src="./control.js" defer="defer"></script>
    </head>

    <body>
        <div class="left-sec">
            <div class="logo-sec">
                <img src="odin-lined.png" alt= "Photo by Jeremy Thomas on Unsplash" 
                class="logo">
                <p class="odin-text">ODIN</p>
            </div>
            <div class="credit">
                Photo by <a href="https://unsplash.com/@jeremythomasphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Jeremy Thomas</a> on 
                <a href="https://unsplash.com/photos/the-stars-and-galaxy-as-seen-from-rocky-mountain-national-park-4dpAqfTbvKA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">
                Unsplash</a>
            </div>
        </div>
        <div class="right-sec">
            <div class="top">
                <p class="para-top"> Ever wonder how planetary mechanics works? </p>
                <p>This is a deep-dive program for the curious minds ready to explore universe!</p>
                <p class="para-bot"> Sign up below to begin the adventure! 👇</p>
            </div>
            <div class="mid">
                <div class="form_legend">Let's do this❤️‍🔥</div>
                <form action="#" id="form_content" method="post">
                    <div>
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="first-name">
                    </div>
                    <div>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                    <div>
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div>
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm" name="confirm" required>
                    </div>
                </form>
            </div>
            <div class="bottom">
                <button type="submit">Create Account</button>
                <div class="already">Aleady have an account?<a href="#">Log in</a></div>
            </div>
        </div>
    </body>
</html>
