<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Saira+Stencil:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="left-sec">
        <div class="logo-sec">
            <img src="odin-lined.png" alt= "Photo by Jeremy Thomas on Unsplash" 
            class="logo">
            <p class="odin-text">ODIN</p>
        </div>
        <div class="credit">
            Photo by <a href="https://unsplash.com/@jeremythomasphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Jeremy Thomas</a> on 
            <a href="https://unsplash.com/photos/the-stars-and-galaxy-as-seen-from-rocky-mountain-national-park-4dpAqfTbvKA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">
            Unsplash</a>
        </div>
    </div>
    <div class="right-sec">
        <div class="top">
            <p class="para-top">A deep-dive program designed for the curious minds 
                ready to explore planetary history, ecosystems, 
                and the mysteries hidden right beneath our feet.</p>
            <p class="para-bot">👉 Sign up below to begin the adventure!</p>
        </div>
        <div class="mid"></div>
        <div class="bottom"></div>
    </div>
</body>
</html>
